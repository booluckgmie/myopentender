name: Daily Tender Scrape

on:
  schedule:
    - cron: "0 1 * * *"   # 09:00 MYT (UTC+8)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Get Playwright version for cache key
        run: echo "PW_VERSION=$(node -e "console.log(require('./node_modules/playwright/package.json').version)")" >> $GITHUB_ENV

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ env.PW_VERSION }}-chromium-firefox-linux

      - name: Install Playwright OS dependencies
        run: npx playwright install-deps chromium firefox

      - name: Install Playwright browsers (skip if cached)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium firefox

      - name: Start Tor (SOCKS5 proxy for ePerolehan WAF bypass)
        run: |
          sudo apt-get install -y tor 2>/dev/null
          sudo service tor start || true
          for i in $(seq 1 30); do
            ss -tlnp 2>/dev/null | grep -q 9050 && echo "Tor SOCKS5 :9050 ready" && break
            sleep 2
          done
          ss -tlnp 2>/dev/null | grep -q 9050 || echo "WARNING: Tor not ready — scraper will skip Tor tier"

      - name: Run scraper + export JSON
        run: npm run scrape:export
        env:
          EPEROLEHAN_PROXY_URL: ${{ secrets.EPEROLEHAN_PROXY_URL || 'socks5://127.0.0.1:9050' }}

      - name: Show summary and guard
        run: |
          node -e "
            const d = require('./tenders.json');
            const prev = (() => { try { return require('child_process').execSync('git show HEAD:tenders.json 2>/dev/null').toString(); } catch { return null; } })();
            const prevCount = prev ? JSON.parse(prev).tenders.length : 0;
            const count = d.tenders.length;
            console.log('Previous count:', prevCount, '→ New count:', count);
            const by = {};
            d.tenders.forEach(t => { by[t.source_id] = (by[t.source_id]||0)+1; });
            Object.entries(by).sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>console.log(' source',k+':',v));
            if (count < prevCount * 0.5 && prevCount > 10) {
              console.error('Count dropped by more than 50% ('+prevCount+'→'+count+') — aborting to protect existing data');
              process.exit(1);
            }
            if (count < 5) {
              console.error('Too few tenders ('+count+') — aborting');
              process.exit(1);
            }
            console.log('Guard passed — committing.');
          "

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tenders.json public/tenders.json tenders.sqlite
          git diff --cached --quiet || git commit -m "chore: auto-scrape $(date -u +%Y-%m-%dT%H:%M)Z"
          git push
